services:
  postgres:
    image: postgres:17-alpine
    container_name: woodpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: woodpg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - woodpg-postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro

volumes:
  woodpg-postgres-data:
